name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests (no dependencies)
        run: node test/run.mjs
      - name: Build both targets
        run: node build.mjs
      - name: Syntax-check every module
        run: |
          set -e
          for f in lib/*.js background/*.js popup/*.js panel/*.js options/*.js content/*.js build.mjs test/*.mjs; do
            node --check "$f"
          done
      - name: web-ext lint (Firefox package)
        run: npx --yes web-ext lint --source-dir dist/firefox --self-hosted || true
